<script>
const FINNISH_DAYS=['Sunnuntai','Maanantai','Tiistai','Keskiviikko','Torstai','Perjantai','Lauantai'];
const FINNISH_MONTHS=['tammikuuta','helmikuuta','maaliskuuta','huhtikuuta','toukokuuta','kesäkuuta','heinäkuuta','elokuuta','syyskuuta','lokakuuta','marraskuuta','joulukuuta'];
const WEEKDAY_NAMES=['Maanantai','Tiistai','Keskiviikko','Torstai','Perjantai'];
const verdictEl=document.getElementById('verdict');
const spinnerEl=document.getElementById('spinner');
const greekWordEl=document.getElementById('greekWord');
const headlineEl=document.getElementById('headline');
const sublineEl=document.getElementById('subline');
const dateLineEl=document.getElementById('dateLine');
const menuCard=document.getElementById('menuCard');
const menuTitle=document.getElementById('menuTitle');
const menuList=document.getElementById('menuList');
const musicBtn=document.getElementById('musicBtn');
const refreshBtn=document.getElementById('refreshBtn');
const leavesEl=document.getElementById('leaves');
const today=new Date();
const dayIdx=today.getDay();
const todayName=FINNISH_DAYS[dayIdx];
dateLineEl.textContent=`${todayName} ${today.getDate()}. ${FINNISH_MONTHS[today.getMonth()]} ${today.getFullYear()}`;

refreshBtn.addEventListener('click',()=>location.reload());

function setVerdict({celebrate=false,sad=false,greek='',headline='',subline=''}) {
  spinnerEl.style.display='none';
  verdictEl.classList.remove('loading');
  verdictEl.classList.toggle('celebrate',celebrate);
  verdictEl.classList.toggle('sad',sad);
  greekWordEl.textContent=greek;
  headlineEl.textContent=headline;
  sublineEl.textContent=subline;
}

function showMenu(title,items,highlightStifado=false) {
  menuTitle.textContent=title;
  menuList.innerHTML='';
  items.forEach(item=>{
    const li=document.createElement('li');
    li.textContent=item;
    if(highlightStifado && /stifado/i.test(item)) li.classList.add('stifado-hit');
    menuList.appendChild(li);
  });
  menuCard.classList.remove('hidden');
}

function spawnLeaves(count=14) {
  for(let i=0;i<count;i++){
    const leaf=document.createElement('div');
    leaf.className='leaf';
    leaf.innerHTML=`<svg viewBox="0 0 18 30" xmlns="http://www.w3.org/2000/svg"><ellipse cx="9" cy="15" rx="5" ry="14" fill="#c9a961" opacity="0.8"/><line x1="9" y1="1" x2="9" y2="29" stroke="#8a6f30" stroke-width="0.6"/></svg>`;
    leaf.style.left=Math.random()*100+'%';
    leaf.style.animationDuration=(5+Math.random()*6)+'s';
    leaf.style.animationDelay=(Math.random()*5)+'s';
    leavesEl.appendChild(leaf);
}

/* ===== MENU FETCHING ===== */
async function fetchMenu() {
  const url='https://www.marmoritupa.fi/lounas.html';
  const proxies=[
    `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
    `https://corsproxy.io/?${encodeURIComponent(url)}`
  ];
  let lastErr;
  for(const proxyUrl of proxies){
    try{
      const res=await fetch(proxyUrl,{signal:AbortSignal.timeout(12000)});
      if(!res.ok) throw new Error(`HTTP ${res.status}`);
      const html=await res.text();
      if(html && html.length>500) return html;
      throw new Error('empty response');
    }catch(e){lastErr=e}
  }
  throw lastErr || new Error('all proxies failed');
}

/*
 * Parse the current Marmoritupa HTML.
 *
 * Current page structure has weekday and date as separate elements:
 *
 *   <h3>Keskiviikko</h3>
 *   <div>30.9.</div>
 *   <ul>
 *     <li>Paahdettua paprikakeittoa L, G</li>
 *     ...
 *   </ul>
 *
 * Older versions used a combined "Keskiviikko 30.9" header.
 * Both structures are supported.
 */
function parseMenuSections(html) {
  const doc=new DOMParser().parseFromString(html,'text/html');
  const sections=[];

  // Current/revised structure.
  const headings=[...doc.querySelectorAll('h2,h3,h4')];

  for(const heading of headings){
    const headingText=heading.textContent.trim();
    const dayMatch=headingText.match(
      /^(Maanantai|Tiistai|Keskiviikko|Torstai|Perjantai)(?:\s+(\d{1,2}\.\d{1,2}\.?))?$/i
    );
    if(!dayMatch) continue;

    const dayName=dayMatch[1];
    let date=dayMatch[2] || '';
    const items=[];
    let node=heading.nextElementSibling;

    while(node){
      const text=node.textContent.trim();

      // Stop at the next weekday heading.
      if(/^(Maanantai|Tiistai|Keskiviikko|Torstai|Perjantai)$/i.test(text) ||
         /^(Maanantai|Tiistai|Keskiviikko|Torstai|Perjantai)\s+\d{1,2}\.\d{1,2}/i.test(text)){
        break;
      }

      // Date is now commonly a separate element.
      if(!date && /^\d{1,2}\.\d{1,2}\.?$/.test(text)) date=text;

      const directItems=[...node.querySelectorAll(':scope > li')];
      if(directItems.length){
        for(const li of directItems){
          const item=li.textContent.trim();
          if(item) items.push(item);
        }
      } else if(text && !/^Päivän lounas$/i.test(text) &&
                !/^Lounasaika/i.test(text) &&
                !/^Lounas\s+\d/i.test(text) &&
                !/^Salaatti/i.test(text) &&
                !/^Lapset/i.test(text)){
        // Avoid accidentally adding wrapper text containing multiple
        // descendants. The revised menu's actual food items are li's.
        if(!node.querySelector('ul,ol')) items.push(text);
      }

      node=node.nextElementSibling;
    }

    if(items.length){
      sections.push({
        header:`${dayName}${date ? ' '+date : ''}`,
        dayName,
        date,
        items:[...new Set(items)]
      });
    }
  }

  if(sections.length) return sections;

  // Fallback for the older flat-text format.
  doc.querySelectorAll('br').forEach(br=>br.replaceWith('\n'));
  doc.querySelectorAll('p,div,li,h1,h2,h3,h4,strong,b').forEach(el=>el.append('\n'));

  const lines=doc.body.textContent
    .replace(/\u00a0/g,' ')
    .split('\n')
    .map(line=>line.trim())
    .filter(Boolean);

  let current=null;

  for(const line of lines){
    const match=line.match(
      /^(Maanantai|Tiistai|Keskiviikko|Torstai|Perjantai)\s*(\d{1,2}\.\d{1,2}\.?)?$/i
    );

    if(match){
      if(current) sections.push(current);
      current={
        header:`${match[1]}${match[2] ? ' '+match[2] : ''}`,
        dayName:match[1],
        date:match[2] || '',
        items:[]
      };
      continue;
    }

    if(!current) continue;
    if(/^L=laktoositon|^Lounas\s+\d|^Lataa\s/i.test(line)) continue;
    current.items.push(line);
  }

  if(current) sections.push(current);
  return sections;
}

function findDaySection(html,dayName) {
  const sections=parseMenuSections(html);
  return sections.find(section=>section.dayName.toLowerCase()===dayName.toLowerCase()) || null;
}

function findStifadoDayThisWeek(html) {
  const sections=parseMenuSections(html);
  return sections.find(section=>/stifado/i.test(section.items.join(' '))) || null;
}

function dayWordPartitive(dayHeader) {
  const m=dayHeader.match(/^(Maanantai|Tiistai|Keskiviikko|Torstai|Perjantai)/i);
  if(!m) return dayHeader;
  const map={
    maanantai:'maanantaina',
    tiistai:'tiistaina',
    keskiviikko:'keskiviikkona',
    torstai:'torstaina',
    perjantai:'perjantaina'
  };
  return map[m[1].toLowerCase()];
}

/* ===== MAIN LOGIC ===== */
async function run(){
  if(dayIdx===0 || dayIdx===6){
    setVerdict({
      sad:true,
      greek:'Κλειστά',
      headline:'Marmoritupa on kiinni',
      subline:'Lounasta tarjoillaan vain arkisin klo 10–14. Tule takaisin maanantaina.'
    });
    return;
  }

  try{
    const html=await fetchMenu();
    const todaySection=findDaySection(html,todayName);

    if(!todaySection){
      setVerdict({
        sad:true,
        greek:'?',
        headline:`${todayName.toUpperCase()}TA EI LÖYTYNYT`,
        subline:'Marmorituvan listalla ei näytä olevan tämän päivän kohtaa. Tarkista listalta itse.'
      });
      return;
    }

    const todayBody=todaySection.items.join(' | ');

    if(/Ravintola\s+suljettu/i.test(todayBody)){
      setVerdict({
        sad:true,
        greek:'Κλειστά',
        headline:'Ravintola suljettu tänään',
        subline:todaySection.items.join(' · ')
      });
      return;
    }

    const hasStifado=/stifado/i.test(todayBody);

    if(hasStifado){
      setVerdict({
        celebrate:true,
        greek:'ΣΤΙΦΑΔΟ',
        headline:'Stifadoa Marmorituvassa!',
        subline:'Stifadoa on tarjolla! Άντε γεια!'
      });
      showMenu(`${todaySection.header} – tarjolla`,todaySection.items,true);
      spawnLeaves();
    }else{
      const futureMatch=findStifadoDayThisWeek(html);
      let subline;

      if(futureMatch){
        const partitive=dayWordPartitive(futureMatch.header);
        subline=`Mutta stifadoa ${partitive}! (${futureMatch.header})`;
      }else{
        const sublines=[
          'Stifadoa joskus toiste — tällä viikolla ei näytä olevan tiedossa.',
          'Stifado loistaa poissaolollaan tällä viikolla. Yritä ensi viikolla.',
          'Ei stifadoa tällä viikolla. Vaihtoehdot ovat silti syömisen arvoisia.'
        ];
        subline=sublines[Math.floor(Math.random()*sublines.length)];
      }

      setVerdict({
        sad:true,
        greek:'Όχι',
        headline:'Ei stifadoa tänään',
        subline
      });
      showMenu(`${todaySection.header} – tarjolla sen sijaan`,todaySection.items,false);
    }
  }catch(err){
    console.error(err);
    setVerdict({
      sad:true,
      greek:'⚠',
      headline:'Lounaslista ei vastaa',
      subline:'Marmorituvan sivuihin ei juuri nyt saatu yhteyttä. Klikkaa alta tarkistaaksesi itse.'
    });
  }
}

/* ===== GREEK MUSIC SYNTHESIS ===== */
let audioCtx=null,masterGain=null,isPlaying=false,scheduler=null,nextNoteTime=0,noteIndex=0,currentTempo=90;
const TARGET_TEMPO=168;
const N={
  D3:146.83,A3:220.00,D4:293.66,Eb4:311.13,F4:349.23,Fs4:369.99,G4:392.00,
  A4:440.00,Bb4:466.16,C5:523.25,Cs5:554.37,D5:587.33,Eb5:622.25,
  Fs5:739.99,G5:783.99,A5:880.00
};
const MELODY=[
  [['D4'],1.0,.9],[['F4'],.5,.7],[['G4'],.5,.7],
  [['A4'],1.0,1.0],[['Bb4'],.5,.7],[['A4'],.5,.7],
  [['G4'],.5,.8],[['F4'],.5,.7],[['G4'],.5,.7],[['F4'],.5,.6],
  [['D4'],1.5,1.0],[['rest'],.5,0],
  [['A4'],.5,.8],[['Bb4'],.5,.7],[['C5'],.5,.8],[['D5'],.5,1.0],
  [['C5'],.5,.7],[['Bb4'],.5,.7],[['A4'],1.0,.9],
  [['G4'],.5,.7],[['F4'],.5,.6],[['G4'],.5,.7],[['A4'],.5,.8],
  [['F4'],1.0,.7],[['D4'],1.0,.9],
  [['A4'],.5,.8],[['G4'],.5,.7],[['F4'],.5,.7],[['D4'],.5,.8],
  [['Eb4'],.5,.6],[['D4'],.5,.7],[['rest'],.5,0],[['A3'],.5,.6],
  [['D4'],2.0,1.0]
];
const BASS=['D3','A3','D3','A3'];

function ensureCtx(){
  if(!audioCtx){
    audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    masterGain=audioCtx.createGain();
    masterGain.gain.value=0;
    masterGain.connect(audioCtx.destination);
    const delay=audioCtx.createDelay(.5);
    delay.delayTime.value=.18;
    const fb=audioCtx.createGain();fb.gain.value=.18;
    const wet=audioCtx.createGain();wet.gain.value=.22;
    delay.connect(fb).connect(delay);
    delay.connect(wet).connect(masterGain);
    window.__delayIn=delay;
  }
}

function pluckNote(freq,time,duration,accent=1,octaveDouble=true){
  if(freq==='rest') return;
  const f=typeof freq==='string'?N[freq]:freq;
  if(!f) return;
  const ctx=audioCtx;
  const o1=ctx.createOscillator();o1.type='sawtooth';o1.frequency.value=f;
  const o2=ctx.createOscillator();o2.type='sawtooth';o2.frequency.value=f;o2.detune.value=7;
  const filter=ctx.createBiquadFilter();filter.type='lowpass';filter.Q.value=3;
  filter.frequency.setValueAtTime(5000*accent,time);
  filter.frequency.exponentialRampToValueAtTime(800,time+duration*.9);
  const env=ctx.createGain();const peak=.18*accent;
  env.gain.setValueAtTime(0,time);
  env.gain.linearRampToValueAtTime(peak,time+.005);
  env.gain.exponentialRampToValueAtTime(.0001,time+Math.max(duration*.95,.08));
  o1.connect(filter);if(octaveDouble)o2.connect(filter);
  filter.connect(env);env.connect(masterGain);
  if(window.__delayIn)env.connect(window.__delayIn);
  o1.start(time);o2.start(time);o1.stop(time+duration+.05);o2.stop(time+duration+.05);
}

function bassNote(freq,time,duration){
  const f=typeof freq==='string'?N[freq]:freq,ctx=audioCtx;
  const o=ctx.createOscillator();o.type='triangle';o.frequency.value=f;
  const env=ctx.createGain();
  env.gain.setValueAtTime(0,time);
  env.gain.linearRampToValueAtTime(.16,time+.01);
  env.gain.exponentialRampToValueAtTime(.0001,time+duration*.95);
  o.connect(env);env.connect(masterGain);o.start(time);o.stop(time+duration+.05);
}

function clap(time,gain=.08){
  const ctx=audioCtx,buf=ctx.createBuffer(1,ctx.sampleRate*.08,ctx.sampleRate),data=buf.getChannelData(0);
  for(let i=0;i<data.length;i++)data[i]=(Math.random()*2-1)*Math.pow(1-i/data.length,2);
  const src=ctx.createBufferSource();src.buffer=buf;
  const filter=ctx.createBiquadFilter();filter.type='highpass';filter.frequency.value=1500;
  const env=ctx.createGain();env.gain.value=gain;
  src.connect(filter).connect(env).connect(masterGain);src.start(time);
}

function scheduleNotes(){
  const horizon=audioCtx.currentTime+.25;
  while(nextNoteTime<horizon){
    const note=MELODY[noteIndex%MELODY.length],beats=note[1],accent=note[2];
    const beatDur=60/currentTempo,dur=beats*beatDur;
    pluckNote(note[0][0],nextNoteTime,dur,accent);
    for(let b=0;b<Math.floor(beats/.5);b++){
      const t=nextNoteTime+b*.5*beatDur;
      bassNote(BASS[(noteIndex+b)%BASS.length],t,.5*beatDur*.9);
      if(b===0&&accent>.85)clap(t+.001,.05);
    }
    nextNoteTime+=dur;noteIndex++;
    if(noteIndex%MELODY.length===0&&currentTempo<TARGET_TEMPO)
      currentTempo=Math.min(TARGET_TEMPO,currentTempo+18);
  }
}

function startMusic(){
  ensureCtx();
  if(audioCtx.state==='suspended')audioCtx.resume();
  isPlaying=true;
  masterGain.gain.cancelScheduledValues(audioCtx.currentTime);
  masterGain.gain.setValueAtTime(masterGain.gain.value,audioCtx.currentTime);
  masterGain.gain.linearRampToValueAtTime(.7,audioCtx.currentTime+.6);
  nextNoteTime=audioCtx.currentTime+.1;noteIndex=0;currentTempo=90;
  scheduler=setInterval(scheduleNotes,50);
  musicBtn.classList.add('playing');musicBtn.textContent='■ Hiljennä';
}

function stopMusic(){
  isPlaying=false;
  if(scheduler){clearInterval(scheduler);scheduler=null}
  if(masterGain&&audioCtx){
    masterGain.gain.cancelScheduledValues(audioCtx.currentTime);
    masterGain.gain.setValueAtTime(masterGain.gain.value,audioCtx.currentTime);
    masterGain.gain.linearRampToValueAtTime(0,audioCtx.currentTime+.4);
  }
  musicBtn.classList.remove('playing');musicBtn.textContent='▶ Käynnistä syrtaki';
}

musicBtn.addEventListener('click',()=>isPlaying?stopMusic():startMusic());
run();
</script>
