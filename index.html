<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stifadoa Marmorituvassa?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --aegean: #0d3b66;
    --aegean-deep: #061f3a;
    --marble: #f1ece1;
    --gold: #c9a961;
    --gold-bright: #e8c875;
    --terracotta: #b85c38;
    --ink: #1a1a1a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    min-height: 100vh;
    font-family: 'Cormorant Garamond', Georgia, serif;
    color: var(--marble);
    background: var(--aegean-deep);
    overflow-x: hidden;
  }

  body {
    background:
      radial-gradient(ellipse at top, #1a5490 0%, var(--aegean) 35%, var(--aegean-deep) 100%),
      var(--aegean-deep);
    position: relative;
  }

  /* Marble veining overlay (subtle nod to Marmoritupa) */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(255,255,255,0.04) 0%, transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(255,255,255,0.03) 0%, transparent 50%),
      radial-gradient(circle at 50% 50%, rgba(0,0,0,0.15) 0%, transparent 60%);
    z-index: 0;
  }

  /* Grain texture */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1;
    opacity: 0.4;
    mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.5'/%3E%3C/svg%3E");
  }

  .meander-strip {
    height: 28px;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='80' height='28' viewBox='0 0 80 28'><g fill='none' stroke='%23c9a961' stroke-width='2'><path d='M0 23 L0 5 L18 5 L18 18 L8 18 L8 11 L13 11 L13 23 Z'/><path d='M20 23 L20 5 L38 5 L38 18 L28 18 L28 11 L33 11 L33 23 Z'/><path d='M40 23 L40 5 L58 5 L58 18 L48 18 L48 11 L53 11 L53 23 Z'/><path d='M60 23 L60 5 L78 5 L78 18 L68 18 L68 11 L73 11 L73 23 Z'/></g></svg>");
    background-repeat: repeat-x;
    background-position: center;
    position: relative;
    z-index: 2;
    opacity: 0.85;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 48px 28px 80px;
    position: relative;
    z-index: 3;
  }

  .eyebrow {
    text-align: center;
    font-family: 'Cinzel', serif;
    font-weight: 500;
    letter-spacing: 0.4em;
    font-size: 11px;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 8px;
    opacity: 0.8;
  }

  .date-line {
    text-align: center;
    font-style: italic;
    font-size: 18px;
    color: var(--marble);
    opacity: 0.7;
    margin-bottom: 56px;
  }

  /* The big verdict card */
  .verdict {
    text-align: center;
    padding: 32px 0;
    min-height: 280px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    transition: opacity 0.6s ease;
  }

  .verdict.loading .greek-word,
  .verdict.loading h1 { opacity: 0; }

  .greek-word {
    font-family: 'Cinzel', serif;
    font-weight: 900;
    font-size: clamp(48px, 11vw, 110px);
    color: var(--gold-bright);
    letter-spacing: 0.06em;
    line-height: 1;
    margin-bottom: 18px;
    text-shadow: 0 4px 20px rgba(201, 169, 97, 0.4), 0 0 60px rgba(201, 169, 97, 0.15);
    opacity: 1;
    transition: opacity 0.6s ease 0.2s;
  }

  .verdict.celebrate .greek-word {
    animation: glow 2.6s ease-in-out infinite;
  }

  @keyframes glow {
    0%, 100% { text-shadow: 0 4px 20px rgba(201, 169, 97, 0.4), 0 0 60px rgba(201, 169, 97, 0.15); }
    50% { text-shadow: 0 4px 30px rgba(201, 169, 97, 0.7), 0 0 100px rgba(201, 169, 97, 0.35); }
  }

  h1 {
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: clamp(22px, 4.5vw, 40px);
    letter-spacing: 0.08em;
    color: var(--marble);
    text-transform: uppercase;
    line-height: 1.2;
    margin-bottom: 10px;
  }

  .verdict.sad h1 {
    color: var(--marble);
    opacity: 0.85;
  }

  .verdict.sad .greek-word {
    color: var(--marble);
    opacity: 0.45;
    font-size: clamp(40px, 9vw, 84px);
  }

  .subline {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: clamp(18px, 2.5vw, 22px);
    color: var(--marble);
    opacity: 0.75;
    max-width: 540px;
    margin: 12px auto 0;
    line-height: 1.4;
  }

  /* Music button */
  .music-control {
    margin-top: 36px;
    display: none;
  }

  .verdict.celebrate .music-control { display: inline-block; }

  .music-button {
    background: transparent;
    border: 1.5px solid var(--gold);
    color: var(--gold-bright);
    padding: 14px 30px;
    font-family: 'Cinzel', serif;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.3s ease;
    border-radius: 0;
    position: relative;
  }

  .music-button:hover {
    background: var(--gold);
    color: var(--aegean-deep);
    transform: translateY(-1px);
    box-shadow: 0 8px 24px rgba(201, 169, 97, 0.25);
  }

  .music-button.playing {
    background: var(--gold);
    color: var(--aegean-deep);
  }

  /* Menu section */
  .menu-card {
    margin-top: 64px;
    padding: 40px 36px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(201, 169, 97, 0.25);
    backdrop-filter: blur(6px);
    position: relative;
  }

  .menu-card::before, .menu-card::after {
    content: '';
    position: absolute;
    width: 14px;
    height: 14px;
    border: 1.5px solid var(--gold);
  }
  .menu-card::before { top: -1px; left: -1px; border-right: none; border-bottom: none; }
  .menu-card::after { bottom: -1px; right: -1px; border-left: none; border-top: none; }

  .menu-title {
    font-family: 'Cinzel', serif;
    font-size: 13px;
    letter-spacing: 0.3em;
    color: var(--gold);
    text-transform: uppercase;
    text-align: center;
    margin-bottom: 24px;
    font-weight: 500;
  }

  .menu-list {
    list-style: none;
    text-align: center;
  }

  .menu-list li {
    font-size: 19px;
    padding: 8px 0;
    color: var(--marble);
    border-bottom: 1px dashed rgba(241, 236, 225, 0.12);
  }
  .menu-list li:last-child { border-bottom: none; }

  .menu-list li.stifado-hit {
    color: var(--gold-bright);
    font-weight: 500;
    font-size: 22px;
    letter-spacing: 0.04em;
    background: linear-gradient(90deg, transparent, rgba(201, 169, 97, 0.12), transparent);
  }

  .footer {
    margin-top: 56px;
    text-align: center;
    font-size: 14px;
    opacity: 0.55;
  }

  .footer a {
    color: var(--gold);
    text-decoration: none;
    border-bottom: 1px dotted var(--gold);
    transition: opacity 0.2s;
  }
  .footer a:hover { opacity: 0.7; }

  .refresh {
    margin-top: 12px;
    background: transparent;
    border: none;
    color: var(--marble);
    opacity: 0.5;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 14px;
    cursor: pointer;
    text-decoration: underline;
  }
  .refresh:hover { opacity: 1; }

  /* Loading spinner */
  .spinner {
    width: 36px;
    height: 36px;
    border: 2px solid rgba(201, 169, 97, 0.2);
    border-top-color: var(--gold);
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
    margin: 0 auto;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Olive leaves falling for celebration */
  .leaf {
    position: fixed;
    top: -40px;
    width: 18px;
    height: 30px;
    z-index: 2;
    pointer-events: none;
    opacity: 0;
  }

  .verdict.celebrate ~ .leaves .leaf {
    animation: fall linear infinite;
  }

  @keyframes fall {
    0% { transform: translateY(-40px) rotate(0deg); opacity: 0; }
    8% { opacity: 0.8; }
    100% { transform: translateY(105vh) rotate(720deg); opacity: 0.4; }
  }

  /* Hidden when not active */
  .hidden { display: none !important; }
</style>
</head>
<body>

<div class="meander-strip"></div>

<div class="container">
  <div class="eyebrow">Marmorituvan stifadotutka</div>
  <div class="date-line" id="dateLine">…</div>

  <div class="verdict loading" id="verdict">
    <div class="spinner" id="spinner"></div>
    <div class="greek-word" id="greekWord"></div>
    <h1 id="headline"></h1>
    <p class="subline" id="subline"></p>
    <div class="music-control">
      <button class="music-button" id="musicBtn">▶  Käynnistä syrtaki</button>
    </div>
  </div>

  <div class="menu-card hidden" id="menuCard">
    <div class="menu-title" id="menuTitle">Tänään tarjolla</div>
    <ul class="menu-list" id="menuList"></ul>
  </div>

  <div class="footer">
    <div>Tiedot: <a href="https://www.marmoritupa.fi/lounas.html" target="_blank" rel="noopener">marmoritupa.fi/lounas</a></div>
    <button class="refresh" id="refreshBtn">tarkista uudelleen</button>
  </div>
</div>

<div class="meander-strip" style="margin-top: 0;"></div>

<div class="leaves" id="leaves"></div>

<script>
  const FINNISH_DAYS = ['Sunnuntai', 'Maanantai', 'Tiistai', 'Keskiviikko', 'Torstai', 'Perjantai', 'Lauantai'];
  const FINNISH_MONTHS = ['tammikuuta', 'helmikuuta', 'maaliskuuta', 'huhtikuuta', 'toukokuuta', 'kesäkuuta', 'heinäkuuta', 'elokuuta', 'syyskuuta', 'lokakuuta', 'marraskuuta', 'joulukuuta'];
  const WEEKDAY_NAMES = ['Maanantai', 'Tiistai', 'Keskiviikko', 'Torstai', 'Perjantai'];

  const verdictEl = document.getElementById('verdict');
  const spinnerEl = document.getElementById('spinner');
  const greekWordEl = document.getElementById('greekWord');
  const headlineEl = document.getElementById('headline');
  const sublineEl = document.getElementById('subline');
  const dateLineEl = document.getElementById('dateLine');
  const menuCard = document.getElementById('menuCard');
  const menuTitle = document.getElementById('menuTitle');
  const menuList = document.getElementById('menuList');
  const musicBtn = document.getElementById('musicBtn');
  const refreshBtn = document.getElementById('refreshBtn');
  const leavesEl = document.getElementById('leaves');

  const today = new Date();
  const dayIdx = today.getDay();
  const todayName = FINNISH_DAYS[dayIdx];
  dateLineEl.textContent = `${todayName} ${today.getDate()}. ${FINNISH_MONTHS[today.getMonth()]} ${today.getFullYear()}`;

  refreshBtn.addEventListener('click', () => location.reload());

  function setVerdict({ celebrate=false, sad=false, greek='', headline='', subline='' }) {
    spinnerEl.style.display = 'none';
    verdictEl.classList.remove('loading');
    verdictEl.classList.toggle('celebrate', celebrate);
    verdictEl.classList.toggle('sad', sad);
    greekWordEl.textContent = greek;
    headlineEl.textContent = headline;
    sublineEl.textContent = subline;
  }

  function showMenu(title, items, highlightStifado=false) {
    menuTitle.textContent = title;
    menuList.innerHTML = '';
    items.forEach(item => {
      const li = document.createElement('li');
      li.textContent = item;
      if (highlightStifado && /stifado/i.test(item)) {
        li.classList.add('stifado-hit');
      }
      menuList.appendChild(li);
    });
    menuCard.classList.remove('hidden');
  }

  function spawnLeaves(count = 14) {
    for (let i = 0; i < count; i++) {
      const leaf = document.createElement('div');
      leaf.className = 'leaf';
      leaf.innerHTML = `<svg viewBox="0 0 18 30" xmlns="http://www.w3.org/2000/svg"><ellipse cx="9" cy="15" rx="5" ry="14" fill="#c9a961" opacity="0.8"/><line x1="9" y1="1" x2="9" y2="29" stroke="#8a6f30" stroke-width="0.6"/></svg>`;
      leaf.style.left = Math.random() * 100 + '%';
      leaf.style.animationDuration = (5 + Math.random() * 6) + 's';
      leaf.style.animationDelay = (Math.random() * 5) + 's';
      leavesEl.appendChild(leaf);
    }
  }

  // ============= MENU FETCHING & PARSING =============

  async function fetchMenu() {
    const url = 'https://www.marmoritupa.fi/lounas.html';
    // CORS proxy — try a couple in case one is down
    const proxies = [
      `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
      `https://corsproxy.io/?${encodeURIComponent(url)}`,
    ];
    let lastErr;
    for (const proxyUrl of proxies) {
      try {
        const res = await fetch(proxyUrl, { signal: AbortSignal.timeout(12000) });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const html = await res.text();
        if (html && html.length > 500) return html;
        throw new Error('empty response');
      } catch (e) {
        lastErr = e;
      }
    }
    throw lastErr || new Error('all proxies failed');
  }

  function normalizeMenuText(text) {
  return text
    .replace(/\u00a0/g, ' ')
    .replace(/\u200b/g, '')
    .replace(/[ \t]+/g, ' ')
    .replace(/\n[ \t]+/g, '\n')
    .split('\n')
    .map(line => line.trim())
    .filter(Boolean);
}

/*
 * Parse Marmoritupa's current HTML structure.
 *
 * Current structure is approximately:
 *
 *   Keskiviikko
 *   30.9.
 *   Paahdettua paprikakeittoa L, G
 *   Jauhelihapihvejä...
 *   ...
 *
 * Older versions sometimes had:
 *
 *   Keskiviikko 30.9
 *   Paahdettua paprikakeittoa...
 *
 * Support both.
 */
function parseMenuSections(html) {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const sections = [];

  // First try the revised HTML structure.
  const headings = [...doc.querySelectorAll('h2, h3, h4')];

  for (const heading of headings) {
    const headingText = heading.textContent.trim();

    const dayMatch = headingText.match(
      /^(Maanantai|Tiistai|Keskiviikko|Torstai|Perjantai)(?:\s+(\d{1,2}\.\d{1,2}\.?))?$/i
    );

    if (!dayMatch) continue;

    const dayName = dayMatch[1];
    let date = dayMatch[2] || '';

    const body = [];

    // Walk forward until the next weekday heading.
    let node = heading.nextElementSibling;

    while (node) {
      const text = node.textContent.trim();

      // Stop at the next weekday heading.
      if (
        /^(Maanantai|Tiistai|Keskiviikko|Torstai|Perjantai)$/i.test(text) ||
        /^(Maanantai|Tiistai|Keskiviikko|Torstai|Perjantai)\s+\d{1,2}\.\d{1,2}/i.test(text)
      ) {
        break;
      }

      // Pick up a separate date element.
      if (!date && /^\d{1,2}\.\d{1,2}\.?$/.test(text)) {
        date = text;
      }

      // Extract individual menu items from lists.
      const listItems = [...node.querySelectorAll(':scope > li')];

      if (listItems.length) {
        for (const li of listItems) {
          const item = li.textContent.trim();
          if (item) body.push(item);
        }
      } else {
        // If this isn't a list, keep useful text.
        // Avoid adding prices, headings and generic page text.
        if (
          text &&
          !/^Päivän lounas$/i.test(text) &&
          !/^Lounasaika/i.test(text) &&
          !/^Lounas\s+\d/i.test(text) &&
          !/^Salaatti/i.test(text) &&
          !/^Lapset/i.test(text)
        ) {
          body.push(text);
        }
      }

      node = node.nextElementSibling;
    }

    if (body.length) {
      sections.push({
        header: `${dayName}${date ? ' ' + date : ''}`,
        dayName,
        date,
        items: [...new Set(body)]
      });
    }
  }

  if (sections.length) {
    return sections;
  }

  // ------------------------------------------------------------
  // Fallback for the old Marmoritupa HTML format.
  // ------------------------------------------------------------

  doc.querySelectorAll('br').forEach(br => br.replaceWith('\n'));

  doc.querySelectorAll(
    'p, div, li, h1, h2, h3, h4, strong, b'
  ).forEach(el => {
    el.append('\n');
  });

  const text = normalizeMenuText(doc.body.textContent);
  const lines = text;

  const anyDayRegex = new RegExp(
    `^(Maanantai|Tiistai|Keskiviikko|Torstai|Perjantai)(?:\\s+\\d{1,2}\\.\\d{1,2}\\.?|)$`,
    'i'
  );

  let current = null;

  for (const line of lines) {
    const match = line.match(
      /^(Maanantai|Tiistai|Keskiviikko|Torstai|Perjantai)\s*(\d{1,2}\.\d{1,2}\.?)?$/i
    );

    if (match) {
      if (current) sections.push(current);

      current = {
        header: `${match[1]}${match[2] ? ' ' + match[2] : ''}`,
        dayName: match[1],
        date: match[2] || '',
        items: []
      };

      continue;
    }

    if (!current) continue;

    if (/^L=laktoositon|^Lounas\s+\d|^Lataa\s/i.test(line)) {
      continue;
    }

    current.items.push(line);
  }

  if (current) sections.push(current);

  return sections;
}


function findDaySection(html, dayName) {
  const sections = parseMenuSections(html);

  return sections.find(
    section => section.dayName.toLowerCase() === dayName.toLowerCase()
  ) || null;
}


function findStifadoDayThisWeek(html) {
  const sections = parseMenuSections(html);

  return sections.find(section =>
    /stifado/i.test(section.items.join(' '))
  ) || null;
}

  function dayWordPartitive(dayHeader) {
    // "Tiistai 28.4" → "tiistaina"; "Keskiviikko" → "keskiviikkona"
    const m = dayHeader.match(/^(Maanantai|Tiistai|Keskiviikko|Torstai|Perjantai)/i);
    if (!m) return dayHeader;
    const map = {
      maanantai: 'maanantaina',
      tiistai: 'tiistaina',
      keskiviikko: 'keskiviikkona',
      torstai: 'torstaina',
      perjantai: 'perjantaina'
    };
    return map[m[1].toLowerCase()];
  }

  // ============= MAIN LOGIC =============

  async function run() {
    // Weekend handling
    if (dayIdx === 0 || dayIdx === 6) {
      setVerdict({
        sad: true,
        greek: 'Κλειστά',
        headline: 'Marmoritupa on kiinni',
        subline: 'Lounasta tarjoillaan vain arkisin klo 10–14. Tule takaisin maanantaina.'
      });
      return;
    }

    try {
      const html = await fetchMenu();
      const text = htmlToCleanText(html);
      const todaySection = findDaySection(text, todayName);

      if (!todaySection) {
        setVerdict({
          sad: true,
          greek: '?',
          headline: `${todayName.toUpperCase()}TA EI LÖYTYNYT`,
          subline: 'Marmorituvan listalla ei näytä olevan tämän päivän kohtaa. Tarkista listalta itse.'
        });
        return;
      }

      const todayBody = todaySection.items.join(' | ');

      if (/Ravintola\s+suljettu/i.test(todayBody)) {
        setVerdict({
          sad: true,
          greek: 'Κλειστά',
          headline: 'Ravintola suljettu tänään',
          subline: todaySection.items.join(' · ')
        });
        return;
      }

      const hasStifado = /stifado/i.test(todayBody);

      if (hasStifado) {
        setVerdict({
          celebrate: true,
          greek: 'ΣΤΙΦΑΔΟ',
          headline: 'Stifadoa Marmorituvassa!',
          subline: 'Stifadoa on tarjolla! Άντε γεια!'
        });
        showMenu(`${todaySection.header} – tarjolla`, todaySection.items, true);
        spawnLeaves();
      } else {
        // See if stifado appears later this week
        const futureMatch = findStifadoDayThisWeek(text);
        let subline;
        if (futureMatch) {
          const partitive = dayWordPartitive(futureMatch.header);
          subline = `Mutta stifadoa ${partitive}! (${futureMatch.header})`;
        } else {
          const sublines = [
            'Stifadoa joskus toiste — tällä viikolla ei näytä olevan tiedossa.',
            'Stifado loistaa poissaolollaan tällä viikolla. Yritä ensi viikolla.',
            'Ei stifadoa tällä viikolla. Vaihtoehdot ovat silti syömisen arvoisia.'
          ];
          subline = sublines[Math.floor(Math.random() * sublines.length)];
        }
        setVerdict({
          sad: true,
          greek: 'Όχι',
          headline: 'Ei stifadoa tänään',
          subline
        });
        showMenu(`${todaySection.header} – tarjolla sen sijaan`, todaySection.items, false);
      }
    } catch (err) {
      console.error(err);
      setVerdict({
        sad: true,
        greek: '⚠',
        headline: 'Lounaslista ei vastaa',
        subline: 'Marmorituvan sivuihin ei juuri nyt saatu yhteyttä. Klikkaa alta tarkistaaksesi itse.'
      });
    }
  }

  // ============= GREEK MUSIC SYNTHESIS =============
  // Original syrtaki-style melody in Hijaz (Phrygian dominant) on D
  // — bright bouzouki-ish timbre, accelerating tempo, looping

  let audioCtx = null;
  let masterGain = null;
  let isPlaying = false;
  let scheduler = null;
  let nextNoteTime = 0;
  let noteIndex = 0;
  let currentTempo = 90; // BPM, slow start
  const TARGET_TEMPO = 168;

  // Hijaz on D: D, Eb, F#, G, A, Bb, C, D, Eb', F#'
  const N = {
    D3: 146.83, A3: 220.00,
    D4: 293.66, Eb4: 311.13, F4: 349.23, Fs4: 369.99, G4: 392.00,
    A4: 440.00, Bb4: 466.16, C5: 523.25, Cs5: 554.37,
    D5: 587.33, Eb5: 622.25, Fs5: 739.99, G5: 783.99, A5: 880.00
  };

  // Original melody — syrtaki feel. Each entry: [freqs (chord = doubled string), beats, accent]
  // Bouzouki traditionally has paired strings tuned in unison or octaves
  const MELODY = [
    // Phrase A — slow, melodic
    [['D4'], 1.0, 0.9], [['F4'], 0.5, 0.7], [['G4'], 0.5, 0.7],
    [['A4'], 1.0, 1.0], [['Bb4'], 0.5, 0.7], [['A4'], 0.5, 0.7],
    [['G4'], 0.5, 0.8], [['F4'], 0.5, 0.7], [['G4'], 0.5, 0.7], [['F4'], 0.5, 0.6],
    [['D4'], 1.5, 1.0], [['rest'], 0.5, 0],
    // Phrase B — climbing
    [['A4'], 0.5, 0.8], [['Bb4'], 0.5, 0.7], [['C5'], 0.5, 0.8], [['D5'], 0.5, 1.0],
    [['C5'], 0.5, 0.7], [['Bb4'], 0.5, 0.7], [['A4'], 1.0, 0.9],
    [['G4'], 0.5, 0.7], [['F4'], 0.5, 0.6], [['G4'], 0.5, 0.7], [['A4'], 0.5, 0.8],
    [['F4'], 1.0, 0.7], [['D4'], 1.0, 0.9],
    // Phrase C — descending tail
    [['A4'], 0.5, 0.8], [['G4'], 0.5, 0.7], [['F4'], 0.5, 0.7], [['D4'], 0.5, 0.8],
    [['Eb4'], 0.5, 0.6], [['D4'], 0.5, 0.7], [['rest'], 0.5, 0], [['A3'], 0.5, 0.6],
    [['D4'], 2.0, 1.0]
  ];

  // Bass pattern: alternates D and A — drone-like
  const BASS = ['D3', 'A3', 'D3', 'A3'];

  function ensureCtx() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = 0.0;
      masterGain.connect(audioCtx.destination);
      // Simple reverb via convolver? Skip — keep it lightweight, use feedback delay.
      const delay = audioCtx.createDelay(0.5);
      delay.delayTime.value = 0.18;
      const fb = audioCtx.createGain();
      fb.gain.value = 0.18;
      const wet = audioCtx.createGain();
      wet.gain.value = 0.22;
      delay.connect(fb).connect(delay);
      delay.connect(wet).connect(masterGain);
      window.__delayIn = delay;
    }
  }

  function pluckNote(freq, time, duration, accent = 1.0, octaveDouble = true) {
    if (freq === 'rest') return;
    const f = typeof freq === 'string' ? N[freq] : freq;
    if (!f) return;
    const ctx = audioCtx;

    // Voice 1: sawtooth, plucked
    const o1 = ctx.createOscillator();
    o1.type = 'sawtooth';
    o1.frequency.value = f;

    // Voice 2: octave-up paired string (bouzouki-style), slightly detuned
    const o2 = ctx.createOscillator();
    o2.type = 'sawtooth';
    o2.frequency.value = f;
    o2.detune.value = 7;

    // Filter — bright pluck that closes
    const filter = ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.Q.value = 3;
    filter.frequency.setValueAtTime(5000 * accent, time);
    filter.frequency.exponentialRampToValueAtTime(800, time + duration * 0.9);

    // Envelope
    const env = ctx.createGain();
    const peak = 0.18 * accent;
    env.gain.setValueAtTime(0, time);
    env.gain.linearRampToValueAtTime(peak, time + 0.005);
    env.gain.exponentialRampToValueAtTime(0.0001, time + Math.max(duration * 0.95, 0.08));

    o1.connect(filter);
    if (octaveDouble) o2.connect(filter);
    filter.connect(env);
    env.connect(masterGain);
    if (window.__delayIn) env.connect(window.__delayIn);

    o1.start(time);
    o2.start(time);
    o1.stop(time + duration + 0.05);
    o2.stop(time + duration + 0.05);
  }

  function bassNote(freq, time, duration) {
    const f = typeof freq === 'string' ? N[freq] : freq;
    const ctx = audioCtx;
    const o = ctx.createOscillator();
    o.type = 'triangle';
    o.frequency.value = f;
    const env = ctx.createGain();
    env.gain.setValueAtTime(0, time);
    env.gain.linearRampToValueAtTime(0.16, time + 0.01);
    env.gain.exponentialRampToValueAtTime(0.0001, time + duration * 0.95);
    o.connect(env);
    env.connect(masterGain);
    o.start(time);
    o.stop(time + duration + 0.05);
  }

  // Hand-clap / tabor accent on downbeats
  function clap(time, gain = 0.08) {
    const ctx = audioCtx;
    const buf = ctx.createBuffer(1, ctx.sampleRate * 0.08, ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) {
      data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / data.length, 2);
    }
    const src = ctx.createBufferSource();
    src.buffer = buf;
    const filter = ctx.createBiquadFilter();
    filter.type = 'highpass';
    filter.frequency.value = 1500;
    const env = ctx.createGain();
    env.gain.value = gain;
    src.connect(filter).connect(env).connect(masterGain);
    src.start(time);
  }

  function scheduleNotes() {
    const lookahead = 0.1;
    const horizon = audioCtx.currentTime + 0.25;
    while (nextNoteTime < horizon) {
      const note = MELODY[noteIndex % MELODY.length];
      const beats = note[1];
      const accent = note[2];
      const beatDur = 60 / currentTempo;
      const dur = beats * beatDur;

      // Play melody note
      pluckNote(note[0][0], nextNoteTime, dur, accent);

      // Bass on each beat (rough metronome)
      const beatsInThisStep = Math.max(1, Math.round(beats / 0.5));
      for (let b = 0; b < Math.floor(beats / 0.5); b++) {
        const t = nextNoteTime + b * 0.5 * beatDur;
        const bassNoteName = BASS[(noteIndex + b) % BASS.length];
        bassNote(bassNoteName, t, 0.5 * beatDur * 0.9);
        if (b === 0 && accent > 0.85) clap(t + 0.001, 0.05);
      }

      nextNoteTime += dur;
      noteIndex++;

      // Tempo accelerates over a few cycles, then locks in
      if (noteIndex % MELODY.length === 0 && currentTempo < TARGET_TEMPO) {
        currentTempo = Math.min(TARGET_TEMPO, currentTempo + 18);
      }
    }
  }

  function startMusic() {
    ensureCtx();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    isPlaying = true;
    masterGain.gain.cancelScheduledValues(audioCtx.currentTime);
    masterGain.gain.setValueAtTime(masterGain.gain.value, audioCtx.currentTime);
    masterGain.gain.linearRampToValueAtTime(0.7, audioCtx.currentTime + 0.6);
    nextNoteTime = audioCtx.currentTime + 0.1;
    noteIndex = 0;
    currentTempo = 90;
    scheduler = setInterval(scheduleNotes, 50);
    musicBtn.classList.add('playing');
    musicBtn.textContent = '■  Hiljennä';
  }

  function stopMusic() {
    isPlaying = false;
    if (scheduler) { clearInterval(scheduler); scheduler = null; }
    if (masterGain && audioCtx) {
      masterGain.gain.cancelScheduledValues(audioCtx.currentTime);
      masterGain.gain.setValueAtTime(masterGain.gain.value, audioCtx.currentTime);
      masterGain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.4);
    }
    musicBtn.classList.remove('playing');
    musicBtn.textContent = '▶  Käynnistä syrtaki';
  }

  musicBtn.addEventListener('click', () => {
    if (isPlaying) stopMusic();
    else startMusic();
  });

  run();
</script>

</body>
</html>
